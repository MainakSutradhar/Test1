<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • HackMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-48 -left-40 h-96 w-96 rounded-full bg-fuchsia-500/20 blur-3xl"></div>
    <div class="absolute -bottom-48 -right-40 h-96 w-96 rounded-full bg-cyan-500/20 blur-3xl"></div>
  </div>

  <header class="app-header relative z-10 supports-[backdrop-filter]:bg-slate-900/40">
    <div class="mx-auto max-w-4xl px-6 py-4 flex items-center justify-between">
      <a href="index.html#home" class="flex items-center gap-3">
        <svg width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="rounded-lg">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0ea5e9"/>
              <stop offset="50%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#f472b6"/>
            </linearGradient>
            <radialGradient id="rg" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
          <circle cx="18" cy="22" r="6" fill="#0b1020"/>
          <circle cx="18" cy="22" r="3" fill="url(#rg)"/>
          <path d="M30 18 h14 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 a6 6 0 0 1 -6 -6 v-6" fill="#0b1020"/>
          <path d="M28 42 l8 -10 l6 6 l10 -14" stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text-sm font-semibold">HackMate</span>
      </a>
      <nav class="hidden md:flex items-center gap-5 text-xs text-slate-300">
        <a href="index.html#home" class="hover:text-white">Home</a>
        <a href="index.html#search" class="hover:text-white">Search</a>
        <a href="signup.html" class="hover:text-white">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="relative z-10 min-h-[calc(100vh-64px)] grid place-items-center px-6 py-10">
    <div class="w-full max-w-md overflow-hidden rounded-2xl border border-white/10 bg-gradient-to-b from-slate-900/40 to-slate-950/60 p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-fuchsia-500 via-violet-500 to-cyan-500"></div>
        <h1 class="text-lg font-extrabold tracking-tight">HackMate</h1>
      </div>
      <h2 class="text-2xl font-bold glow-text glow-pulse">Welcome back</h2>
      <p class="mt-1 text-sm text-slate-400">Log in to continue</p>
      <form class="mt-6 space-y-3">
        <input type="email" placeholder="Email" class="w-full rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm" />
        <input type="password" placeholder="Password" class="w-full rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm" />
        <div class="flex items-center justify-between text-xs text-slate-400">
          <label class="inline-flex items-center gap-2"><input type="checkbox" class="rounded border-white/10 bg-slate-900"/> Remember me</label>
          <a href="#" class="text-cyan-300 hover:underline">Forgot password?</a>
        </div>
        <button type="button" onclick="location.href='index.html#home'" class="w-full rounded-lg bg-gradient-to-br from-fuchsia-500 to-cyan-500 px-4 py-2 text-sm font-semibold text-white shadow-[0_0_40px_-12px_rgba(34,211,238,0.6)] hover:opacity-95">Login</button>
      </form>
      <p class="mt-4 text-sm text-slate-400">New here? <a href="signup.html" class="text-cyan-300 hover:underline">Create an account</a></p>
    </div>
  </main>
</body>
<script>
  function headerOnScroll(){const h=document.querySelector('.app-header');if(!h)return;window.scrollY>4?h.classList.add('scrolled'):h.classList.remove('scrolled');}
  document.addEventListener('scroll', headerOnScroll, {passive:true});
</script>
</html>
