<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up • HackMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-48 -left-40 h-96 w-96 rounded-full bg-fuchsia-500/20 blur-3xl"></div>
    <div class="absolute -bottom-48 -right-40 h-96 w-96 rounded-full bg-cyan-500/20 blur-3xl"></div>
  </div>

  <main class="relative z-10 min-h-screen grid place-items-center px-6 py-10">
    <div class="w-full max-w-lg overflow-hidden rounded-2xl border border-white/10 bg-gradient-to-b from-slate-900/40 to-slate-950/60 p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-fuchsia-500 via-violet-500 to-cyan-500"></div>
        <h1 class="text-lg font-extrabold tracking-tight">HackMate</h1>
      </div>
      <h2 class="text-2xl font-bold glow-text glow-pulse">Create your account</h2>
      <p class="mt-1 text-sm text-slate-400">Join to find teammates and teams</p>
      <form class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" placeholder="Full name" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm md:col-span-2" />
        <input type="email" placeholder="Email" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm md:col-span-2" />
        <input type="password" placeholder="Password" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm" />
        <input type="password" placeholder="Confirm password" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm" />
        <input type="text" placeholder="College / Organization" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm md:col-span-2" />
        <input type="text" placeholder="Location" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm md:col-span-2" />
        <textarea placeholder="Short bio / README" rows="4" class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-sm md:col-span-2"></textarea>
        <div class="md:col-span-2 flex items-center justify-end gap-3">
          <button type="button" onclick="location.href='index.html#home'" class="rounded-lg border border-white/10 bg-white/5 px-4 py-2 text-sm text-white hover:bg-white/10">Cancel</button>
          <button type="button" onclick="location.href='index.html#home'" class="rounded-lg bg-gradient-to-br from-fuchsia-500 to-cyan-500 px-4 py-2 text-sm font-semibold text-white shadow-[0_0_40px_-12px_rgba(34,211,238,0.6)] hover:opacity-95">Create Account</button>
        </div>
      </form>
      <p class="mt-4 text-sm text-slate-400">Already have an account? <a href="login.html" class="text-cyan-300 hover:underline">Login</a></p>
    </div>
  </main>
</body>
</html>
